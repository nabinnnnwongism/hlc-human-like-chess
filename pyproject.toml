[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanlike-chess"
version = "0.1.0"
description = "Human-Like Chess Bot (moves + human-like move timing)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "torch>=2.2.0",
    "python-chess>=1.10.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    "huggingface-hub>=0.23.0",
    "playwright>=1.40.0",
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
eval = [
    "pyarrow>=15.0.0",
    "zstandard>=0.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "_maia3_repo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
